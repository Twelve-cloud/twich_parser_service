# dependencies
[build-system]
build-backend = "poetry.core.masonry.api"
requires      = [ "poetry-core>=1.0.0" ]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
dependency-injector = "4.41.0"
fastapi             = "0.104.1"
pydantic            = "2.6.4"
pydantic-settings   = "2.2.1"
python              = "3.10.*"
uvicorn             = "0.24.0"
uvloop              = "0.21.0"

strawberry-graphql = { extras = [ "fastapi" ], version = "=0.219.1" } # check if extra is needed

mongoengine = "0.27.0"
pymongo     = "4.6.1"

redis       = "5.0.1"
types-redis = "4.6.0.11"

elasticsearch     = "7.10.1"
elasticsearch-dsl = "7.4.0"

SQLAlchemy     = "2.0.30"
aiohttp        = "3.9.1"
alembic        = "1.13.1"
asyncpg        = "0.29.0"
fastapi-cache2 = "0.2.1"
kafka-python   = "2.0.2"
py-automapper  = "1.2.3"

[tool.poetry.group.dev.dependencies]
Flake8-pyproject = "1.2.3"
black            = "23.9.1"
flake8           = "5.0.4"
isort            = "5.12.0"
mypy             = "1.6.0"
pre-commit       = "3.4.0"

httpx       = "0.26.0"
pytest      = "7.2.0"
pytest-cov  = "4.0.0"
pytest-mock = "3.10.0"

# formatters
[tool.isort]
combine_as_imports         = true
force_grid_wrap            = 2
include_trailing_comma     = true
line_length                = 100
lines_after_imports        = 2
lines_before_imports       = 2
lines_between_sections     = 1
multi_line_output          = 3
split_on_trailing_comma    = true
treat_all_comments_as_code = true
use_parentheses            = true

[tool.black]
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
)/
'''
include = '\.pyi?$'
line-length = 100
skip-string-normalization = true

# linters
[tool.flake8]
exclude         = [ '.venv', 'data', 'migrations' ]
ignore          = [ 'B905', 'B907', 'E203', 'E266', 'E704', 'W503' ]
max-complexity  = 18
max-line-length = 100
select          = [ 'B', 'B9', 'C', 'E', 'F', 'T4', 'W' ]

[tool.mypy]
check_untyped_defs     = true
disallow_untyped_defs  = true
ignore_missing_imports = true
plugins                = [ 'pydantic.mypy' ]
strict_optional        = true
warn_redundant_casts   = true

[tool.pydantic-mypy]
init_forbid_extra             = true
init_typed                    = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
check_untyped_defs    = false
disallow_untyped_defs = false
module                = 'tests.*'
strict_optional       = false

# tests
[tool.pytest.ini_options]
addopts          = "-l -v -rsxX -p no:warnings --tb=short --strict-markers"
minversion       = "7.2.0"
norecursedirs    = ".venv .mypy_cache .pytest_cache data docs"
python_classes   = "*Test Test*"
python_files     = "test_* *_test tests_* *_tests unit* *unit func* *func"
python_functions = "test_*  *_test"
testpaths        = "tests"

[tool.coverage.run]
branch = true
omit   = [ "*/migrations/*", "*/tests/*", "*apps.py", "*asgi.py", "*settings*.py", "*urls.py", "*wsgi.py", "manage.py" ]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = ".coverage_report"
